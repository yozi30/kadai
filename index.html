<!DOCTYPE html>
<html lang="en-us" translate="no">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="google" content="notranslate">
    <title>Unity Web Player | Gacha</title>
    <style>
      /* 画面の余白を消し、背景を黒にしてゲームを真ん中に寄せる設定 */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #231F20;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }
      #unity-canvas {
        box-shadow: 0px 4px 10px rgba(0,0,0,0.5); /* 枠線に少し影をつけて見やすく */
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1" style="width: 1920px; height: 1080px; background: #231F20"></canvas>
    <script src="Build/kadai.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";
      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/kadai.data.unityweb",
        frameworkUrl: "Build/kadai.framework.js.unityweb",
        codeUrl: "Build/kadai.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Gacha",
        productVersion: "1.0",
        matchWebGLToCanvasSize: false, 
        devicePixelRatio: 1, 
      }).then((unityInstance) => {
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
