<!DOCTYPE html>
<html lang="en-us" translate="no">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="google" content="notranslate">
    <title>Unity Web Player | Gacha</title>
    <style>
      /* 画面全体の余白をなくし、背景を黒にする */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #231F20;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }
      /* 👈 ここが重要：画面に合わせてゲーム枠を綺麗に自動リサイズする設定 */
      #unity-canvas {
        width: 100vw !important;
        height: 56.25vw !important; /* 16:9 の比率を維持する計算 */
        max-width: 177.78vh !important;
        max-height: 100vh !important;
        box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
      }
    </style>
  </head>
  <body>
    <!-- 本体の固定サイズ指定をCSSで上書きできるように修正 -->
    <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1" style="background: #231F20"></canvas>
    <script src="Build/kadai.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";
      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/kadai.data.unityweb",
        frameworkUrl: "Build/kadai.framework.js.unityweb",
        codeUrl: "Build/kadai.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Gacha",
        productVersion: "1.0",
        // 自動リサイズと高DPIバグを確実に防止
        matchWebGLToCanvasSize: false, 
        devicePixelRatio: 1, 
      }).then((unityInstance) => {
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
